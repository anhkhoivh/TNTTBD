services:
  api:
    build:
      context: ./TNTTBD.Services
    image: anhkhoivh/tnttbd-api:latest
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - FileStorage__BasePath=/app/uploads
      - FileStorage__BaseUrl=
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tnttbd;Username=postgres;Password=
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /volume1/docker/tnttbd/uploads:/app/uploads
    restart: unless-stopped

  ui:
    build:
      context: ./TNTTBD.UI
      args:
        BUILD_CONFIGURATION: production,docker
    image: anhkhoivh/tnttbd-ui:latest
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 
      POSTGRES_DB: tnttbd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tnttbd"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: 
      PGADMIN_DEFAULT_PASSWORD: 
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
  uploads: