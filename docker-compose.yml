services:
  api:
    image: anhkhoivh/tnttbd-api:latest
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tnttbd;Username=postgres;Password=tnttbd
    depends_on:
      - db
    restart: unless-stopped

  ui:
    image: anhkhoivh/tnttbd-ui:latest
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tnttbd
      POSTGRES_DB: tnttbd
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata: