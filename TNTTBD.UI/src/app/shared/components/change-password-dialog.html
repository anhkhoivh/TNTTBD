<h2 mat-dialog-title>{{ 'password.change' | t }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="form">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'password.current' | t }}</mat-label>
      <input matInput formControlName="currentPassword" type="password" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'password.new' | t }}</mat-label>
      <input matInput formControlName="newPassword" type="password" required minlength="6" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'password.confirm' | t }}</mat-label>
      <input matInput formControlName="confirmPassword" type="password" required />
    </mat-form-field>

    @if (mismatch()) {
      <p class="error">{{ 'password.mismatch' | t }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="ref.close()">{{ 'common.cancel' | t }}</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
      {{ 'common.save' | t }}
    </button>
  </mat-dialog-actions>
</form>
