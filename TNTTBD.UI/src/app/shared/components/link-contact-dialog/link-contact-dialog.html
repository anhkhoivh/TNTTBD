<h2 mat-dialog-title>{{ 'contact.linkExisting' | t }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'contact.searchContact' | t }}</mat-label>
      <input matInput formControlName="contactSearch" [matAutocomplete]="auto" />
      <mat-autocomplete #auto>
        @for (s of suggestions(); track s.id) {
          <mat-option [value]="s.label" (onSelectionChange)="pick(s)">
            {{ s.label }}
          </mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'contact.relation' | t }}</mat-label>
      <mat-select formControlName="relationType" required>
        @for (r of relationTypes; track r.v) {
          <mat-option [value]="r.v">{{ r.k | t }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="ref.close()">{{ 'common.cancel' | t }}</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="!selected() || form.invalid">
      {{ 'common.save' | t }}
    </button>
  </mat-dialog-actions>
</form>
