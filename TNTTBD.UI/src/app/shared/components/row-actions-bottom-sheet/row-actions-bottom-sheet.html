<mat-nav-list>
  @if (data.canView) {
    <button mat-list-item type="button" (click)="choose('view')">
      <mat-icon matListItemIcon>{{ data.viewIcon ?? 'visibility' }}</mat-icon>
      <span matListItemTitle>{{ (data.viewLabelKey ?? 'common.view') | t }}</span>
    </button>
  }
  @if (data.canEdit) {
    <button mat-list-item type="button" (click)="choose('edit')">
      <mat-icon matListItemIcon>edit</mat-icon>
      <span matListItemTitle>{{ 'common.edit' | t }}</span>
    </button>
  }
  @if (data.canDelete) {
    <button mat-list-item type="button" (click)="choose('delete')">
      <mat-icon matListItemIcon color="warn">{{ data.deleteIcon ?? 'delete' }}</mat-icon>
      <span matListItemTitle>{{ (data.deleteLabelKey ?? 'common.delete') | t }}</span>
    </button>
  }
</mat-nav-list>
