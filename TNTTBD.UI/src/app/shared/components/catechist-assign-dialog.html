<h2 mat-dialog-title>{{ 'catechist.assign' | t }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'catechist.selectCatechist' | t }}</mat-label>
      <input
        matInput
        formControlName="catechistSearch"
        [matAutocomplete]="auto"
      />
      <mat-autocomplete #auto>
        @for (s of suggestions(); track s.id) {
          <mat-option [value]="s.label" (onSelectionChange)="pickSuggestion(s)">
            {{ s.label }}
          </mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'catechist.role' | t }}</mat-label>
      <mat-select formControlName="role" required>
        @for (r of roles; track r.v) {
          <mat-option [value]="r.v" [disabled]="r.v === 'Main' && hasMain">
            {{ r.k | t }}
            @if (r.v === 'Main' && hasMain) { ({{ 'catechist.alreadyHasMain' | t }}) }
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'common.note' | t }}</mat-label>
      <input matInput formControlName="note" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="ref.close()">{{ 'common.cancel' | t }}</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="!selectedCatechist()">
      {{ 'common.save' | t }}
    </button>
  </mat-dialog-actions>
</form>
