<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>{{ 'auth.signIn' | t }}</mat-card-title>
      <mat-card-subtitle>{{ 'app.title' | t }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'auth.identifier' | t }}</mat-label>
          <input
            matInput
            type="text"
            formControlName="identifier"
            required
            placeholder="Không cần @mail.com"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'auth.password' | t }}</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            required
          />
        </mat-form-field>

        @if (error()) {
          <p class="error">{{ error()! | t }}</p>
        }

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="loading() || form.invalid"
        >
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            {{ 'auth.signIn' | t }}
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
