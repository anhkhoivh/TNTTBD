<mat-card>
  <mat-card-header>
    <mat-card-title>{{ 'nav.users' | t }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="data().items" class="full-width">
      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let row">{{ row.userName }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>{{ 'auth.email' | t }}</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>{{ 'user.role' | t }}</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip>{{ roleName(row.userRole) }}</mat-chip>
        </td>
      </ng-container>
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          @if (row.isActive) {
            <mat-icon class="ok">check_circle</mat-icon>
          } @else {
            <mat-icon class="ko">block</mat-icon>
          }
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols"></tr>
    </table>
    @if (data().items.length === 0) {
      <p class="text-center mt-16">{{ 'common.noData' | t }}</p>
    }
  </mat-card-content>
</mat-card>
